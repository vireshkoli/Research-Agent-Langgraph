[project]
name = "research-agent"
version = "0.1.0"
description = "ReAct research agent on an explicit LangGraph state graph, with hard budgets and a trace-level evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Viresh Koli" }]
dependencies = [
    "langgraph>=1.2.4",
    "openai>=2.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "ddgs>=9.14",
    "gradio==6.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "evals", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# evals/ is a top-level package rather than part of the installed wheel: it is the
# harness that measures the wheel, not part of what ships.
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["src/research_agent", "evals"]
ignore_missing_imports = true
disallow_untyped_defs = true
# LangGraph nodes return *partial* state updates, so node returns are dict[str, Any].
# Strict mode fights that constantly; scattered `# type: ignore` reads worse than no mypy.

[[tool.mypy.overrides]]
# Gradio attaches event methods (.click, .submit, ...) to components dynamically
# through a metaclass, so whether mypy can see them depends on the interpreter it
# is run under — this passed on 3.12.13 locally and failed on 3.12.3 in CI. The
# relaxation is scoped to the one module that touches those APIs rather than
# turned off project-wide or scattered as inline ignores that are themselves
# unused on half the machines that run them.
module = "research_agent.ui.*"
disable_error_code = ["attr-defined"]
