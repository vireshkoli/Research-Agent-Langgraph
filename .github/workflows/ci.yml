name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # setup-uv publishes floating major tags only through v7, so this pins the
        # exact release instead.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy
      - name: Unit tests (LLM calls are faked; no API key needed)
        run: uv run pytest -q

      - name: Eval dataset validates and dry-run spends nothing
        run: uv run python -m evals.run --dry-run

      - name: REPORT.md is a pure function of the committed results
        # The point of this job: it proves mechanically that every number in the
        # report — and so every number quoted in the README — comes from a
        # committed artifact rather than from something typed once by hand.
        run: |
          if [ -f evals/results/full.json ]; then
            uv run python -m evals.report
            git diff --exit-code evals/REPORT.md
          else
            echo "no results committed yet; skipping"
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t research-agent:ci .
      - name: Boot it and check it serves
        # A build that succeeds is not the same as an image that runs. This also
        # pins the unprivileged-user property the sandbox notes depend on.
        run: |
          docker run -d --rm --name ra-ci -p 7860:7860 \
            -e RA_DAILY_CAP_USD=0 -e OPENAI_API_KEY=sk-dummy research-agent:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:7860/; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:7860/
          test "$(docker exec ra-ci id -u)" = "1000"
          docker stop ra-ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        # The pre-commit hook only protects people who install it. This is the
        # check that actually gates the branch.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
